# Sustained ground-travel abilities. Trainer levels/IDs come from m_class_spell; a recorded
# profile's actual spell IDs decide what it knows. No talent build is assumed.
# Ground-only conservative timing: caves, water, model floors and unknown terrain use the
# existing baseline. Each walking leg pays the activation cost (no persistent form assumed).
# Sources, checked 2026-10-24:
# https://www.wowhead.com/forever/spell=783/travel-form
# https://www.wowhead.com/classic/spell=2645/ghost-wolf
# https://www.wowhead.com/classic/spell=5118/aspect-of-the-cheetah

[[ability]]
class = "druid"
name = "Travel Form"
spells = [783]
bonus = 0.4
activation = 1.5

